@if(member(); as member){  
    <div routerLink="/members/{{member.id}}" 
            class="card relative rounded-xl 
                   overflow-hidden cursor-pointer 
                   transition-all duration-300
                   ease-in-out transform hover:-translate-y-2
            ">

        <img 
            [src]="member?.imageUrl || '/user.png'" 
            [alt]="member.displayName + ' image'"
            class="w-full h-60 object-cover transition-transform duration-300 group-hover:scale-110"
        >

        <div class="card-actions 
           absolute bottom-0 left-0 w-full
         bg-linear-to-t from-black via-black/75 to-black/0 px-4 py-3

         ">
            <div class="flex flex-col text-white">
                
                <span class="font-semibold text-lg">
                    {{member.displayName}}, {{member.dateOfBirth | age}}
                </span>

                <span class="text-sm opacity-90">
                    {{member.city}}
                </span>

            </div>
        </div>

    </div>
}
